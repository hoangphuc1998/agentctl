[package]
name = "agentctl-core"
version = "0.1.0"
edition = "2021"
description = "Core run-management behavior for Agent Manager"
license = "MIT"

[lib]
name = "agentctl_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

