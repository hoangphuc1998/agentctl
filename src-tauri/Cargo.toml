[package]
name = "agent-manager-desktop"
version = "0.1.0"
edition = "2021"
description = "Linux desktop app for managing agentctl runs"
license = "MIT"

[lib]
name = "agent_manager_desktop"
path = "src/lib.rs"

[[bin]]
name = "agent-manager"
path = "src/main.rs"

[features]
default = []
tauri-app = [
    "dep:axum",
    "dep:futures-util",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
]
tauri-plugin-dialog = ["dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2.2", features = [], optional = true }

[dependencies]
agentctl-core = { path = "../core" }
axum = { version = "0.7", features = ["ws"], optional = true }
chrono = "0.4"
futures-util = { version = "0.3", optional = true }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-notification = { version = "2.3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
